name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  docs-validation:
    name: Docs validation
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/ci-check.ps1
